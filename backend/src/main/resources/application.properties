spring.application.name=farmwise-backend
server.port=8080

# Spring Data MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/farmwise_new

# JWT Security Configuration
farmwise.jwt.secret=${FARMWISE_JWT_SECRET:local-development-secret-change-this-before-deployment-1234567890}
farmwise.jwt.expiration-ms=86400000

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.farmwise=DEBUG

# Weather response cache: expire entries 10 minutes after write
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=100
